[project]
name = "pyodide-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.20.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.mypy]
strict = false
ignore_missing_imports = true
